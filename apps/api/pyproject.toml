[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evalboard-api"
version = "0.1.0"
description = "EvalBoard evaluation workbench API and worker"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic>=1.16,<2",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "jsonschema>=4.25,<5",
  "langchain>=1,<2",
  "langchain-core>=1,<2",
  "langchain-openai>=1,<2",
  "langgraph>=1,<2",
  "langgraph-checkpoint-postgres>=2,<4",
  "langgraph-checkpoint-sqlite>=2,<4",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.10,<3",
  "pwdlib[argon2]>=0.2,<1",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.scripts]
evalboard = "evalboard.cli:main"

[dependency-groups]
dev = ["mypy>=1.17,<2", "pytest>=8.4,<10", "ruff>=0.12,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/evalboard"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false
disable_error_code = ["no-untyped-def", "annotation-unchecked"]
